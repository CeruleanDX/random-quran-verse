<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random Quran Verse</title>
<style>
  body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #0f2a24; color: #f3ead2; text-align: center; }
  a { color: #e8c872; }
</style>
</head>
<body>
<div>
  <p>Opening a random verse…</p>
  <p><a id="fallback" href="https://quran.com/1/1">Tap here if nothing happens</a></p>
</div>
<script>
  // Number of verses in each of the 114 surahs (total 6236)
  var counts = [7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6];
  var total = counts.reduce(function (a, b) { return a + b; }, 0);
  var n = Math.floor(Math.random() * total);   // uniform over all verses
  var surah = 0;
  while (n >= counts[surah]) { n -= counts[surah]; surah++; }
  var url = "https://quran.com/" + (surah + 1) + "/" + (n + 1);
  document.getElementById("fallback").href = url;
  window.location.replace(url);
</script>
</body>
</html>
